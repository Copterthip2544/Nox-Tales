name: Private verified Color Noir film revision
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install bounded production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip -q install numpy scipy pyloudnorm cryptography
      - name: Prepare ephemeral media delivery key
        run: |
          python3 - <<'PYKEY'
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          from pathlib import Path
          k=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          Path('/tmp/film-private.pem').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path('film-request-public.pem').write_bytes(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          PYKEY
      - uses: actions/upload-artifact@v4
        with:
          name: film-request-public-key
          path: film-request-public.pem
          retention-days: 1
      - name: Restore private sources, mix, render, verify and deliver draft
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PYWORK'
          from pathlib import Path
          import os,json,base64,secrets,zipfile,io,hashlib,subprocess,time,re,struct,concurrent.futures
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];rid=os.environ['REQUEST_ID'];root=Path('/tmp/film-v05');root.mkdir(exist_ok=True);proof=root/'proof';proof.mkdir(exist_ok=True)
          def api(path,data=None,method=None):
           q=Request('https://api.github.com/'+path,data=data,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'})
           with urlopen(q,timeout=180) as f:return json.load(f)
          status={'status':'starting','request_id':rid};(proof/'status.json').write_text(json.dumps(status))
          try:
           meta=None
           for i in range(120):
            try:meta=api('repos/'+repo+'/contents/.film_requests/'+rid+'.json');break
            except HTTPError as e:
             if e.code!=404:raise
            time.sleep(4)
           if not meta:raise TimeoutError('Private render plan not supplied')
           if meta.get('content'):env=json.loads(base64.b64decode(meta['content']))
           else:
            with urlopen(meta['download_url'],timeout=60) as f:env=json.load(f)
           private=serialization.load_pem_private_key(Path('/tmp/film-private.pem').read_bytes(),password=None);oaep=padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None);key=private.decrypt(base64.b64decode(env['wrapped_key']),oaep);plan=json.loads(AESGCM(key).decrypt(base64.b64decode(env['nonce']),base64.b64decode(env['ciphertext']),rid.encode()));media_key=base64.b64decode(plan['media_key'])
           def fetch(c):
            d=api('repos/'+repo+'/git/blobs/'+c['sha']);raw=AESGCM(media_key).decrypt(base64.b64decode(c['nonce']),base64.b64decode(d['content']),c['aad'].encode());assert hashlib.sha256(raw).hexdigest()==c['plain_sha256'];return c['index'],raw
           pieces={}
           with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            for i,b in pool.map(fetch,plan['chunks']):pieces[i]=b
           archive=b''.join(pieces[i] for i in range(len(pieces)));assert hashlib.sha256(archive).hexdigest()==plan['bundle_sha256'];del pieces
           z=zipfile.ZipFile(io.BytesIO(archive));assert z.testzip() is None
           for n in z.namelist():
            dest=root/n;assert dest.resolve().is_relative_to(root);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(n))
           del z,archive
           print('Verified private input bundle restored',flush=True)
           subprocess.run(['python3',str(root/'build_v05.py')],check=True)
           render_script=root/'render_v05.py';render_script.write_text(render_script.read_text().replace('pan=stereo|c0=c0|c1=c0','volume=-3.0103dB,pan=stereo|c0=c0|c1=c0'))
           subprocess.run(['python3',str(render_script)],check=True)
           out=root/'deliverables';video=out/'FRAME_TALES_The_Sealed_Case_Part1_Color_Noir_v05.mp4';edit=json.load(open(out/'Part1_Edit_Plan_v05.json'))
           fp=json.loads(subprocess.check_output(['ffprobe','-v','error','-count_frames','-show_streams','-show_format','-of','json',str(video)]));vs=next(s for s in fp['streams'] if s['codec_type']=='video');assert (vs['width'],vs['height'])==(1920,1080);assert int(vs['nb_read_frames'])==round(edit['duration_seconds']*24);assert abs(float(fp['format']['duration'])-edit['duration_seconds'])<.1
           # MP4 structure: exactly one header and one media atom.
           atoms=[]
           with video.open('rb') as f:
            while f.tell()<video.stat().st_size:
             offset=f.tell();head=f.read(8)
             if len(head)<8:break
             sz,kind=struct.unpack('>I4s',head)
             if sz==1:sz=struct.unpack('>Q',f.read(8))[0]
             if sz==0:sz=video.stat().st_size-offset
             assert sz>=8;atoms.append(kind.decode('ascii'));f.seek(offset+sz)
           assert atoms.count('moov')==atoms.count('mdat')==1
           subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(video),'-f','null','-'],check=True,stderr=subprocess.PIPE)
           s=subprocess.run(['ffmpeg','-hide_banner','-nostats','-i',str(video),'-af','loudnorm=I=-19.16:TP=-4.5:LRA=5:print_format=json','-f','null','-'],capture_output=True,text=True,check=True).stderr;m=re.search(r'\{\s*"input_i".*?\}',s,re.S);loud=json.loads(m.group());assert float(loud['input_tp'])<=-4.3,loud;assert abs(float(loud['input_i'])-(-19.16))<0.7,loud
           # Pick representative encoded frames for every scene plus each changed/generated visual.
           chosen=[]
           for sc in range(1,14):chosen.append((f'scene_{sc:02}',(edit['scene_bounds'][str(sc)]['start']+edit['scene_bounds'][str(sc)]['end'])/2))
           seen=set()
           for sh in edit['shots']:
            if sh['visual'] in plan['new_visual_keys'] and sh['visual'] not in seen:chosen.append((sh['visual'],(sh['start']+sh['end'])/2));seen.add(sh['visual'])
           for label,t in chosen:subprocess.run(['ffmpeg','-v','error','-ss',str(t),'-i',str(video),'-frames:v','1','-vf','scale=960:540','-q:v','3',str(proof/(label+'.jpg'))],check=True)
           for name in ['Part1_Edit_Plan_v05.json','Audio_Cue_QA_v05.json','Action_Gates_v05.json','Time_Map_v04_to_v05.json','Part1_Cue_Timeline_v05.csv','Part1_TH_v05.srt']: (proof/name).write_bytes((out/name).read_bytes())
           sha=hashlib.sha256(video.read_bytes()).hexdigest();release=api('repos/'+repo+'/releases/'+str(plan['release_id']));assert release['draft'] is True
           # Only after full decode and timing checks upload a private draft asset.
           upload=release['upload_url'].split('{')[0]+'?name='+video.name
           q=Request(upload,data=video.read_bytes(),method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'video/mp4'})
           with urlopen(q,timeout=900) as f:asset=json.load(f)
           assert asset['state']=='uploaded' and asset['size']==video.stat().st_size
           if asset.get('digest'):assert asset['digest']=='sha256:'+sha
           receipt={'status':'complete_verified','request_id':rid,'duration_seconds':edit['duration_seconds'],'size':video.stat().st_size,'sha256':sha,'asset':asset,'release_url':release['html_url'],'full_decode':True,'mp4_atoms':atoms,'loudness':loud,'cue_count':len(edit['cues']),'shot_count':len(edit['shots']),'script_words_unchanged':True,'all_flat_cards_removed':True,'proof_frames':len(chosen)}
           (proof/'Delivery_Receipt_v05.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2));status={'status':'complete_verified'};print('Private draft master uploaded and verified',sha,flush=True)
          except Exception as e:
           status={'status':'failed','error':str(e),'type':type(e).__name__};
           if (root/'deliverables/render_v05_ffmpeg.log').exists():(proof/'render_error_tail.txt').write_text((root/'deliverables/render_v05_ffmpeg.log').read_text()[-4000:])
          print('Render stopped:',type(e).__name__,str(e)[:500],flush=True);raise
          finally:(proof/'status.json').write_text(json.dumps(status,indent=2))
          PYWORK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-v05-proof-and-receipt
          path: /tmp/film-v05/proof
          retention-days: 7
