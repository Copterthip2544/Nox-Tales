name: Frame Tales - remove temporary Hotel13 public media
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-hotel13-facebook-media.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotel13-facebook-media
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'hotel13-facebook-media-cleanup-01')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the temporary release and delete only the approved temporary media
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/hotel13-v02-media" > temporary-release.json
          python3 - <<'PY'
          import json
          d=json.load(open('temporary-release.json'))
          assert d['id']==443426035
          assert d['tag_name']=='hotel13-v02-media'
          assert len(d['assets'])==1
          a=d['assets'][0]
          assert a['id']==740836229
          assert a['name']=='Frame_Tales_Hotel13_Full_v02.mp4'
          assert a['size']==318291106
          assert a['digest']=='sha256:d02a4607c12c1f8ae07557e6e7c8ef9d31f265eb142ec4d9e52742ea6405864f'
          print('Temporary media identity verified; scheduler-owned copy already verified before this workflow was dispatched.')
          PY
          gh release delete hotel13-v02-media --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
