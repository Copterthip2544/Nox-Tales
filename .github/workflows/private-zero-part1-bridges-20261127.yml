name: Zero Document Part 1 approved single actor production
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      delivery_public_key:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zero-document-part1-bridges-20261127
  cancel-in-progress: false
jobs:
  serial_voice:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install audio tools
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; }
          python3 -m pip -q install cryptography==46.0.3 faster-whisper==1.2.1
      - name: Create ephemeral encryption key
        run: python3 scripts/zero_voice_worker_bridges_20261127.py setup
      - name: Publish public request key only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-request-public-key
          path: request_public.pem
          retention-days: 1
      - name: Receive locked Part 1 only
        env:
          REPO_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/zero_voice_worker_bridges_20261127.py receive
      - name: Generate only NOX with approved Charon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/zero_voice_worker_bridges_20261127.py synth 0
      - name: Independently check completed NOX cues
        if: ${{ always() }}
        run: python3 scripts/zero_voice_worker_bridges_20261127.py check 0 partial
      - name: Encrypt NOX checkpoint
        if: ${{ always() }}
        run: python3 scripts/zero_voice_worker_bridges_20261127.py package 0
      - name: Retain encrypted NOX only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-voice-NOX
          path: encrypted-NOX.json
          if-no-files-found: ignore
          retention-days: 7
