        },
        {
          "name": "Upload FON encrypted checkpoint",
          "if": "${{ always() && (steps.gen4.outcome == 'success' || steps.gen4.outcome == 'failure') }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
