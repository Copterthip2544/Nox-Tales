name: Private source-aligned dialogue timing
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Nonsecret request identifier
        required: true
        type: string
      delivery_public_key:
        description: Base64 public encryption key for returned audio
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: private-source-aligned-dialogue
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Prepare ephemeral request key
        shell: bash
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -version >/dev/null
          python3 -m pip -q install cryptography==46.0.3
          python3 - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          p=Path('private-work');p.mkdir(mode=0o700)
          k=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          (p/'request_private.pem').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          (p/'request_private.pem').chmod(0o600)
          Path('request_public.pem').write_bytes(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          PY
      - name: Publish only the ephemeral public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-request-public-key
          path: request_public.pem
          retention-days: 1
      - name: Receive encrypted request and synthesize bounded scene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,time,io,wave,hashlib,re,zipfile,secrets
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text());args=event['inputs']
          rid=args['request_id']
          if not re.fullmatch('[a-f0-9]{24}',rid):raise SystemExit('Invalid request id')
          public=serialization.load_pem_public_key(base64.b64decode(args['delivery_public_key'],validate=True))
          private=serialization.load_pem_private_key(Path('private-work/request_private.pem').read_bytes(),password=None)
          oaep=padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None)
          out=Path('private-work/audio');out.mkdir();manifest={'status':'waiting_for_request','samples':[]}
          mf=out/'manifest.json'
          def save():mf.write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          save();failed=False
          try:
            url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.voice_requests/'+rid+'.json?ref=main'
            incoming=None
            for attempt in range(120):
              req=Request(url,headers={'Authorization':'Bearer '+os.environ['REPO_READ_TOKEN'],'Accept':'application/vnd.github+json','Cache-Control':'no-cache'})
              try:
                with urlopen(req,timeout=30) as response:meta=json.load(response)
                incoming=json.loads(base64.b64decode(meta['content'])) if meta.get('encoding')=='base64' else json.load(urlopen(meta['download_url'],timeout=30));break
              except HTTPError as e:
                if e.code!=404:raise
              time.sleep(4)
            if incoming is None:raise TimeoutError('Encrypted request did not arrive')
            key=private.decrypt(base64.b64decode(incoming['wrapped_key']),oaep)
            plain=AESGCM(key).decrypt(base64.b64decode(incoming['nonce']),base64.b64decode(incoming['ciphertext']),rid.encode())
            plan=json.loads(plain)
            # Read encrypted prior outputs with a fresh unauthenticated redirect request.
            if plan.get('source_archives'):
              from urllib.request import build_opener,HTTPRedirectHandler
              class NoRedirect(HTTPRedirectHandler):
                def redirect_request(self,req,fp,code,msg,headers,newurl):return None
              archived={}
              for archive in plan['source_archives']:
                req=Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(archive['artifact_id'])+'/zip',headers={'Authorization':'Bearer '+os.environ['REPO_READ_TOKEN'],'Accept':'application/vnd.github+json'})
                try:
                  with build_opener(NoRedirect).open(req,timeout=60) as resp:blob=resp.read()
                except HTTPError as redirect:
                  if redirect.code not in (301,302,303,307,308):raise
                  with urlopen(redirect.headers['Location'],timeout=120) as resp:blob=resp.read()
                with zipfile.ZipFile(io.BytesIO(blob)) as z:old=json.loads(z.read('encrypted-scene-result.json'))
                oldkey=serialization.load_pem_private_key(archive['delivery_private_pem'].encode(),password=None)
                aes=oldkey.decrypt(base64.b64decode(old['wrapped_key']),oaep)
                restored=AESGCM(aes).decrypt(base64.b64decode(old['nonce']),base64.b64decode(old['ciphertext']),old['request_id'].encode())
                with zipfile.ZipFile(io.BytesIO(restored)) as z:
                  oldmanifest=json.loads(z.read('manifest.json'))
                  for oldrecord in oldmanifest['samples']:
                    if oldrecord.get('status')=='complete':archived[oldrecord['id']]=(oldrecord,z.read(oldrecord['file']))
              for t in plan['samples']:
                oldrecord,blob=archived[t['id']]
                if hashlib.sha256(blob).hexdigest()!=oldrecord['sha256']:raise ValueError('Archived audio hash mismatch')
                t['existing_flac']=base64.b64encode(blob).decode()
                if oldrecord.get('alignment_status')=='complete':t['cue_alignment']=oldrecord['cue_alignment'];t['alignment_status']='complete'
            if not all(t.get('existing_flac') for t in plan['samples']):raise ValueError('Alignment worker accepts existing audio only')
            if plan['model']!='gemini-3.8-flash-tts' or not 1<=len(plan['samples'])<=30:raise ValueError('Invalid bounded plan')
            for t in plan['samples']:
              if t['voice'] not in {'Charon','Orus','Callirrhoe','Schedar','Erinome','Vindemiatrix','Rasalgethi','Iapetus','Gacrux','Algieba','Kore','Alnilam','Achird'} or not re.fullmatch('[A-Z0-9_]{1,40}',t['id']) or not 1<=len(t['text'])<=5000:raise ValueError('Invalid cue')
            manifest.update(status='generating',model=plan['model'],request_id=rid);save()
            for t in plan['samples']:
              start=time.monotonic();record={**t,'status':'request_started'};manifest['samples'].append(record);save()
              if t.get('existing_flac'):
                import subprocess
                file=out/(t['id']+'.flac');file.write_bytes(base64.b64decode(t['existing_flac'],validate=True))
                seconds=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(file)]))
                record.pop('existing_flac',None);record.update(status='complete',file=file.name,duration_seconds=seconds,sha256=hashlib.sha256(file.read_bytes()).hexdigest(),reused=True);save()
                print(t['id']+' recovered without API call',flush=True);continue
              turns=t.get('turns') or [{'text':t['text'],'style':t['style'],'speaker':'Voice','voice':t['voice']}]
              voices={v['speaker']:v['voice'] for v in turns}
              if not 1<=len(set(voices.values()))<=2:raise ValueError('Maximum two voices per chunk')
              multi=len(set(voices.values()))>1
              parts=[{'text':v['text'],'speech_metadata':dict(style=v['style'],**({'speaker':v['speaker']} if multi else {}))} for v in turns]
              speech={'multiSpeakerVoiceConfig':{'speakerVoiceConfigs':[{'speaker':who,'voiceConfig':{'prebuiltVoiceConfig':{'voiceName':voice}}} for who,voice in voices.items()]}} if multi else {'voiceConfig':{'voice':t['voice']}}
              payload={'contents':[{'role':'user','parts':parts}],'generationConfig':{'responseModalities':['AUDIO'],'speechConfig':speech}}
              req=Request('https://generativelanguage.googleapis.com/v1beta/models/'+plan['model']+':generateContent',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'x-goog-api-key':os.environ['GEMINI_API_KEY'],'Content-Type':'application/json'},method='POST')
              with urlopen(req,timeout=180) as response:result=json.load(response)
              cs=result.get('candidates',[])
              if len(cs)!=1 or cs[0].get('finishReason')!='STOP':raise ValueError('Incomplete generation')
              aa=[p['inlineData'] for p in cs[0].get('content',{}).get('parts',[]) if 'inlineData' in p]
              if len(aa)!=1:raise ValueError('Expected one audio payload')
              raw=base64.b64decode(aa[0]['data'],validate=True)
              if raw[:4]!=b'RIFF' or raw[8:12]!=b'WAVE':raise ValueError('Expected WAV, refusing guessed PCM settings')
              with wave.open(io.BytesIO(raw),'rb') as w:
                seconds=w.getnframes()/w.getframerate()
                if seconds<=0:raise ValueError('Empty audio')
              import subprocess
              wavfile=out/(t['id']+'.wav');wavfile.write_bytes(raw);file=out/(t['id']+'.flac')
              subprocess.run(['ffmpeg','-v','error','-y','-i',str(wavfile),'-c:a','flac',str(file)],check=True)
              wavfile.unlink()
              record.update(status='complete',file=file.name,duration_seconds=seconds,sha256=hashlib.sha256(file.read_bytes()).hexdigest());save()
              print(t['id']+' complete '+str(round(seconds,2))+' seconds',flush=True)
              if t!=plan['samples'][-1]:time.sleep(max(0,14.5-(time.monotonic()-start)))
            import subprocess,difflib
            for record in manifest['samples']:
              if record.get('alignment_status')=='complete':
                print(record['id']+' existing timing retained',flush=True);continue
              turns=record['turns']
              audio=(out/record['file']).read_bytes()
              targets=[{'cue_id':t['cue_id'],'speaker':t['speaker'],'text':t['text']} for t in turns]
              prompt='Listen closely to this ACTUAL Thai audio and align the provided ordered script utterances to the speech. Return JSON {"cues":[{"cue_id":"...","start":0.0,"end":1.0,"heard_text":"actual Thai words heard"}]}. Include every cue exactly once in source order. Times are seconds from beginning of audio, audible first and last phoneme, based on listening, NEVER estimate by character count or divide duration uniformly. No music or directions are targets. Short responses and pauses matter. Speech can use natural pronunciation variants of script. The entire file duration is '+str(record['duration_seconds'])+' seconds. TARGETS: '+json.dumps(targets,ensure_ascii=False)
              payload={'contents':[{'role':'user','parts':[{'text':prompt},{'inlineData':{'mimeType':'audio/flac','data':base64.b64encode(audio).decode()}}]}],'generationConfig':{'responseMimeType':'application/json','temperature':0,'maxOutputTokens':24000}}
              req=Request('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'x-goog-api-key':os.environ['GEMINI_API_KEY'],'Content-Type':'application/json'},method='POST')
              with urlopen(req,timeout=240) as resp:answer=json.load(resp)
              txt=''.join(p.get('text','') for p in answer['candidates'][0]['content']['parts'] if not p.get('thought')).strip()
              if txt.startswith('```'):txt=txt.split('\n',1)[1].rsplit('```',1)[0]
              (out/(record['id']+'_acoustic_response.json')).write_text(txt)
              aligned=json.loads(txt)['cues']
              if len(aligned)!=len(turns):raise ValueError('Acoustic cue count mismatch '+record['id'])
              cue_times=[];clean=lambda x:re.sub(r'[^ก-๙A-Za-z0-9]','',x).lower()
              for turn,cue in zip(turns,aligned):
                a=float(cue['start']);b=float(cue['end'])
                if cue['cue_id']!=turn['cue_id'] or not 0<=a<b<=record['duration_seconds']+.2:raise ValueError('Acoustic cue boundary invalid '+record['id'])
                if difflib.SequenceMatcher(None,clean(cue.get('heard_text','')),clean(turn['text'])).ratio()<.45:raise ValueError('Acoustic transcript differs '+turn['cue_id'])
                if cue_times and a<cue_times[-1]['end']-.12:raise ValueError('Acoustic cue overlap '+record['id'])
                cue_times.append({**turn,'start':a,'end':min(b,record['duration_seconds']),'method':'whole-audio acoustic script alignment','heard_text':cue.get('heard_text')})
              record['cue_alignment']=cue_times;record['alignment_status']='complete';save()
              print(record['id']+' acoustically aligned '+str(len(cue_times))+' cues',flush=True)
            manifest['status']='complete';manifest['alignment_status']='complete';save()
          except Exception as e:
            failed=True;detail=e.read(20000).decode(errors='replace') if isinstance(e,HTTPError) else '';manifest.update(status='stopped_without_retry',error_type=type(e).__name__,http_status=getattr(e,'code',None),provider_error_body=detail,error_message=str(e));save()
            print('Stopped without retry: '+type(e).__name__,flush=True)
          finally:
            stream=io.BytesIO()
            with zipfile.ZipFile(stream,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(out.glob('*')):z.writestr(f.name,f.read_bytes())
            key=secrets.token_bytes(32);nonce=secrets.token_bytes(12)
            envelope={'request_id':rid,'wrapped_key':base64.b64encode(public.encrypt(key,oaep)).decode(),'nonce':base64.b64encode(nonce).decode(),'ciphertext':base64.b64encode(AESGCM(key).encrypt(nonce,stream.getvalue(),rid.encode())).decode()}
            Path('encrypted-scene-result.json').write_text(json.dumps(envelope))
          if failed:raise SystemExit(1)
          PY
      - name: Retain encrypted audio only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-scene-result
          path: encrypted-scene-result.json
          if-no-files-found: ignore
          retention-days: 7
