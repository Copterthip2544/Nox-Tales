name: Render Hotel13 Full Film
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/render-hotel13-full.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel13-full-render
  cancel-in-progress: false
jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'render-hotel13-full-01')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FILM_ROOT: episodes/hotel13/v1.3/production/full
      FILM_MASTERS: episodes/hotel13/v1.3/production/masters
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Restore approved voices without regenerating speech
        uses: actions/download-artifact@v4
        with:
          name: hotel13-full-audio
          path: production-output
          run-id: 42983299790
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build film timeline and sound mix
        run: |
          AUDIO_DIR="$(dirname "$(find production-output -name speech_timeline.csv -print -quit)")"
          test -f "$AUDIO_DIR/speech_timeline.csv"
          python "$FILM_ROOT/tools/build_full_edit.py" --audio "$AUDIO_DIR" --root "$FILM_ROOT" --opening-report "$FILM_ROOT/opening_report_v03.json"
      - name: Render reviewed film in 1080p
        run: python "$FILM_ROOT/tools/render_full_film.py" --root "$FILM_ROOT" --masters "$FILM_MASTERS" --workers 2
      - name: Check video stream and complete decode
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,sample_rate -of json "$FILM_ROOT/outputs/Frame_Tales_Hotel13_Full_v01.mp4" > "$FILM_ROOT/outputs/ffprobe.json"
          ffmpeg -v error -i "$FILM_ROOT/outputs/Frame_Tales_Hotel13_Full_v01.mp4" -f null -
      - name: Save downloadable film and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hotel13-full-film-v01
          retention-days: 14
          if-no-files-found: error
          path: |
            episodes/hotel13/v1.3/production/full/outputs/Frame_Tales_Hotel13_Full_v01.mp4
            episodes/hotel13/v1.3/production/full/outputs/render_report.json
            episodes/hotel13/v1.3/production/full/outputs/sound_report.json
            episodes/hotel13/v1.3/production/full/outputs/shot_list.csv
            episodes/hotel13/v1.3/production/full/outputs/full_edit_plan.json
            episodes/hotel13/v1.3/production/full/outputs/used_visual_QA.json
            episodes/hotel13/v1.3/production/full/outputs/ffprobe.json
