        {
          "name": "Upload encrypted MALI checkpoint",
          "if": "${{ always() && (steps.gen5.outcome == 'success' || steps.gen5.outcome == 'failure') }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tenant-mali-voice-v02",
            "path": "encrypted-MALI-result.json",
