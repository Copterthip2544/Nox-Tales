name: Maysa soft voice audition 01

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: Authorize one short Maysa sample and applicable API usage
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  audition:
    if: inputs.confirm_generation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate only the requested Maysa sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMPLE_CHARACTER: maysa
          CONFIRM_GENERATION: 'true'
        run: python3 scripts/preview_voices.py
      - name: Save Maysa preview
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maysa-soft-preview
          path: voice-previews/
          if-no-files-found: ignore
          retention-days: 7
