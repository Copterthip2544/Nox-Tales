name: Check Gemini connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check_gemini.py
      - .github/workflows/check-gemini.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check key and list models (no generation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/check_gemini.py
      - name: Save model catalogue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-model-catalogue
          path: reports/
          if-no-files-found: error
          retention-days: 7
