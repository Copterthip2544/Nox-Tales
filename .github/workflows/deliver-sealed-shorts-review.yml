name: Deliver four reviewed Sealed Case Shorts
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare ephemeral delivery encryption key
        run: |
          python3 -m pip -q install cryptography
          python3 - <<'PYKEY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          k=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          Path('/tmp/shorts-private.pem').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path('shorts-delivery-public.pem').write_bytes(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          PYKEY
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-delivery-public-key
          path: shorts-delivery-public.pem
          retention-days: 1
      - name: Deliver exact previously verified MP4 bytes to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PYWORK'
          from pathlib import Path
          import json,os,time,base64,hashlib,zipfile,io,concurrent.futures
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];rid=os.environ['REQUEST_ID'];root=Path('/tmp/shorts-delivery');root.mkdir(exist_ok=True)
          def api(path):
           with urlopen(Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}),timeout=180) as r:return json.load(r)
          meta=None
          for i in range(180):
           try:meta=api('repos/'+repo+'/contents/.shorts_delivery_requests/'+rid+'.json');break
           except HTTPError as e:
            if e.code!=404:raise
           time.sleep(3)
          assert meta,'Delivery envelope not received'
          envelope=json.loads(base64.b64decode(meta['content']));private=serialization.load_pem_private_key(Path('/tmp/shorts-private.pem').read_bytes(),password=None);key=private.decrypt(base64.b64decode(envelope['wrapped_key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None));plan=json.loads(AESGCM(key).decrypt(base64.b64decode(envelope['nonce']),base64.b64decode(envelope['ciphertext']),rid.encode()));aes=AESGCM(base64.b64decode(plan['media_key']))
          def fetch(c):
           b=api('repos/'+repo+'/git/blobs/'+c['sha']);raw=aes.decrypt(base64.b64decode(c['nonce']),base64.b64decode(b['content']),c['aad'].encode());assert hashlib.sha256(raw).hexdigest()==c['plain_sha256'];return c['index'],raw
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:pieces=dict(pool.map(fetch,plan['chunks']))
          bundle=b''.join(pieces[i] for i in range(len(pieces)));assert hashlib.sha256(bundle).hexdigest()==plan['bundle_sha256']
          release=api('repos/'+repo+'/releases/'+str(plan['release_id']));assert release['draft'];assets=[]
          with zipfile.ZipFile(io.BytesIO(bundle)) as z:
           assert z.testzip() is None
           for m in plan['files']:
            name=Path(m['path']).name;assert name.endswith('.mp4') and '/' not in name;raw=z.read(name);assert len(raw)==m['bytes'] and hashlib.sha256(raw).hexdigest()==m['sha256'];assert m['full_decode']=='pass'
            upload=release['upload_url'].split('{')[0]+'?name='+name;request=Request(upload,data=raw,method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'video/mp4'})
            with urlopen(request,timeout=300) as r:a=json.load(r)
            assert a['state']=='uploaded' and a['size']==m['bytes'];assert a.get('digest')=='sha256:'+m['sha256'];assets.append({**m,'github_asset_id':a['id'],'download_url':a['browser_download_url']});print('Uploaded and verified',name,flush=True)
          receipt={'status':'complete_verified','release_url':release['html_url'],'release_id':release['id'],'draft':True,'verified_assets':len(assets),'assets':assets,'scheduled_publication':False,'music_added':False}
          (root/'Delivery_Receipt.json').write_text(json.dumps(receipt,indent=2));assert len(assets)==4
          PYWORK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-delivery-receipt
          path: /tmp/shorts-delivery/Delivery_Receipt.json
          retention-days: 7
