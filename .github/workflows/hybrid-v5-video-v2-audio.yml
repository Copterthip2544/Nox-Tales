name: V5 picture with original V2 voices only
on:
  workflow_dispatch:
    inputs:
      timeline_b64:
        type: string
        required: true
      audio_request_id:
        type: string
        required: true
      release_id:
        type: string
        required: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip -q install av numpy Pillow cryptography
      - name: Prepare private original-speech request
        run: |
          python3 - <<'PYKEY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          k=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          Path('/tmp/dry-audio-private.pem').write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path('dry-audio-request-public.pem').write_bytes(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          PYKEY
      - uses: actions/upload-artifact@v4
        with:
          name: speech-only-request-public-key
          path: dry-audio-request-public.pem
          retention-days: 1
      - name: Assemble existing picture and original speech only
        env:
          GH_TOKEN: ${{ github.token }}
          TIMELINE_B64: ${{ inputs.timeline_b64 }}
          RELEASE_ID: ${{ inputs.release_id }}
          AUDIO_REQUEST_ID: ${{ inputs.audio_request_id }}
        run: |
          python3 - <<'PYWORK'
          from pathlib import Path
          import os,json,zlib,base64,hashlib,subprocess,urllib.request,urllib.error,math,time,concurrent.futures
          import numpy as np
          import av
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          R=Path('/tmp/hybrid-v06');R.mkdir(exist_ok=True);P=R/'proof';P.mkdir(exist_ok=True);repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];plan=json.loads(zlib.decompress(base64.b64decode(os.environ['TIMELINE_B64'])));release_id=int(os.environ['RELEASE_ID']);status={'status':'starting'}
          def api(path):
           q=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(q,timeout=120) as f:return json.load(f)
          def download_asset(id,dest,sha):
           q=urllib.request.Request('https://api.github.com/repos/'+repo+'/releases/assets/'+str(id),headers={'Authorization':'Bearer '+token,'Accept':'application/octet-stream','Cache-Control':'no-cache'})
           with urllib.request.urlopen(q,timeout=300) as response,dest.open('wb') as f:
            while True:
             b=response.read(4*1024*1024)
             if not b:break
             f.write(b)
           assert hashlib.sha256(dest.read_bytes()).hexdigest()==sha,'Source asset SHA mismatch'
          def restore_original_speech(dest):
           rid=os.environ['AUDIO_REQUEST_ID'];meta=None
           for _ in range(120):
            try:meta=api('repos/'+repo+'/contents/.speech_only_requests/'+rid+'.json');break
            except urllib.error.HTTPError as e:
             if e.code!=404:raise
            time.sleep(4)
           assert meta and meta.get('content'),'Missing encrypted original-voice source plan'
           env=json.loads(base64.b64decode(meta['content']));private=serialization.load_pem_private_key(Path('/tmp/dry-audio-private.pem').read_bytes(),password=None);key=private.decrypt(base64.b64decode(env['wrapped_key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None));media=json.loads(AESGCM(key).decrypt(base64.b64decode(env['nonce']),base64.b64decode(env['ciphertext']),rid.encode()));mk=base64.b64decode(media['key'])
           def get(c):
            response=api('repos/'+repo+'/git/blobs/'+c['sha']);raw=AESGCM(mk).decrypt(base64.b64decode(c['nonce']),base64.b64decode(response['content']),c['aad'].encode());assert hashlib.sha256(raw).hexdigest()==c['plain_sha256'];return raw
           with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool,dest.open('wb') as f:
            for raw in pool.map(get,media['chunks']):f.write(raw)
           assert dest.stat().st_size==media['size'] and hashlib.sha256(dest.read_bytes()).hexdigest()==media['sha256']==plan['audio_provenance']['sha256']
           return media
          def pcm(path):return np.frombuffer(subprocess.check_output(['ffmpeg','-v','error','-i',str(path),'-map','0:a:0','-ar','24000','-ac','1','-f','f32le','pipe:1']),dtype='<f4')
          try:
           video=R/'source_v5.mp4';audio=R/'original_v2_voices_only.flac';download_asset(plan['video_asset_id'],video,plan['video_sha256']);media=restore_original_speech(audio);print('Verified actual v5 video and isolated original v2 voice recordings; no background tracks',flush=True)
           fps=plan['fps'];frames=round(plan['duration_seconds']*fps);times=np.arange(frames)/fps;anchors=plan['anchors'];src_t=np.interp(times,[a['output_v2'] for a in anchors],[a['source_v5'] for a in anchors]);indices=np.clip(np.rint(src_t*fps).astype(np.int32),0,round(plan['video_source_duration']*fps)-1)
           sh=plan['source_shots'];which=np.searchsorted([s['start'] for s in sh],indices/fps,side='right')-1;cuts=np.r_[0,np.flatnonzero(np.diff(which)!=0)+1,frames];short=[]
           # Do not flash pre-action poses for fractions of a second where v2 has no extra Nox bridge.
           for lo,hi in zip(cuts,cuts[1:]):
            if hi-lo<12 and lo>0:short.append({'start':lo/fps,'end':hi/fps,'visual':sh[which[lo]]['visual']});indices[lo:hi]=indices[lo-1]
           assert np.all(np.diff(indices)>=0),'Picture mapping must remain monotonic'
           destination=R/'FRAME_TALES_The_Sealed_Case_Part1_v06_VideoV5_VoicesV2_ONLY.mp4';tmp=destination.with_name(destination.stem+'.rendering.mp4')
           cmd=['ffmpeg','-hide_banner','-loglevel','warning','-y','-f','rawvideo','-pixel_format','yuv420p','-video_size','1920x1080','-framerate',str(fps),'-i','pipe:0','-i',str(audio),'-map','0:v:0','-map','1:a:0','-frames:v',str(frames),'-t',str(plan['duration_seconds']),'-c:v','libx264','-preset','fast','-crf','18','-threads','2','-c:a','aac','-b:a','160k','-ar','48000','-ac','2','-movflags','+faststart','-progress',str(R/'progress.txt'),str(tmp)]
           expected={round(float(t)*fps):None for t in plan['proof_times']};probe_sources={int(indices[i]) for i in expected};proof_indices={}
           with (R/'encode.log').open('w') as log:
            enc=subprocess.Popen(cmd,stdin=subprocess.PIPE,stderr=log);container=av.open(str(video));vstream=container.streams.video[0];vstream.thread_type='AUTO';out=0
            try:
             for source_index,frame in enumerate(container.decode(vstream)):
              if source_index in probe_sources:frame.to_image().resize((960,540)).save(P/f'source_{source_index}.jpg',quality=93)
              if out>=frames:break
              if indices[out]>source_index:continue
              raw=frame.to_ndarray(format='yuv420p').tobytes()
              while out<frames and indices[out]<=source_index:
               enc.stdin.write(raw)
               if out in expected:proof_indices[out]=source_index
               out+=1
              if source_index%(fps*120)==0:print('Picture source seconds',round(source_index/fps),'output frames',out,flush=True)
             assert out==frames,(out,frames)
            finally:container.close();enc.stdin.close()
            assert enc.wait()==0,'Encoder failed'
           os.replace(tmp,destination);print('Visual assembly complete; checking final audio against unmixed original voice track',flush=True)
           original=pcm(audio);result=pcm(destination);n=min(len(original),len(result));original=original[:n];result=result[:n];signal=float(np.mean(original.astype(float)**2));error=float(np.mean((original.astype(float)-result.astype(float))**2));snr=10*math.log10(max(signal,1e-15)/max(error,1e-15));assert snr>20.,('Encoded voice differs from original source',snr)
           # A whole no-dialogue scene contains no music, ambience, ringtones, typing or other effects.
           sms_start=next(a['output_v2'] for a in anchors if a['reason']=='SC6_start');sms_end=next(a['output_v2'] for a in anchors if a['reason']=='SC6_end');quiet_peak=float(np.max(np.abs(result[round((sms_start+.5)*24000):round((sms_end-.5)*24000)])));assert quiet_peak<1e-4,('Unexpected audio in speech-free scene',quiet_peak)
           ff=json.loads(subprocess.check_output(['ffprobe','-v','error','-count_frames','-show_streams','-show_format','-of','json',str(destination)]));vs=next(x for x in ff['streams'] if x['codec_type']=='video');assert int(vs['nb_read_frames'])==frames and vs['width']==1920 and vs['height']==1080;assert abs(float(ff['format']['duration'])-plan['duration_seconds'])<.05
           subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(destination),'-f','null','-'],check=True,stderr=subprocess.PIPE)
           # Compare encoded output images with the exact source v5 frames chosen by the map.
           from PIL import Image
           diffs=[]
           for frame_index,source_index in proof_indices.items():
            path=P/f'output_{frame_index}.jpg';subprocess.run(['ffmpeg','-v','error','-ss',str(frame_index/fps),'-i',str(destination),'-frames:v','1','-vf','scale=960:540','-q:v','2',str(path)],check=True);aa=np.asarray(Image.open(P/f'source_{source_index}.jpg').convert('RGB'),dtype=float);bb=np.asarray(Image.open(path).convert('RGB'),dtype=float);diff=float(np.mean(np.abs(aa-bb)));assert diff<8.,(frame_index,diff);diffs.append({'output_frame':frame_index,'source_frame':source_index,'mean_abs_error':diff})
           (P/'Timeline_Map_v06.json').write_text(json.dumps(plan,indent=2));(P/'Visual_Frame_Comparisons.json').write_text(json.dumps(diffs,indent=2));(P/'Short_Flash_Suppression.json').write_text(json.dumps(short,indent=2))
           release=api('repos/'+repo+'/releases/'+str(release_id));assert release['draft'];url=release['upload_url'].split('{')[0]+'?name='+destination.name;q=urllib.request.Request(url,data=destination.read_bytes(),method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'video/mp4'})
           with urllib.request.urlopen(q,timeout=900) as f:asset=json.load(f)
           sha=hashlib.sha256(destination.read_bytes()).hexdigest();assert asset['state']=='uploaded' and asset['size']==destination.stat().st_size;assert asset.get('digest') in [None,'sha256:'+sha]
           receipt={'status':'complete_verified','video_source':'v05 actual encoded frames','audio_source':'v02 original isolated voice recordings; original timing; music, SFX and ambience removed','speech_source_flac_sha256':media['sha256'],'encoded_speech_snr_db':snr,'speech_free_scene_peak_dbfs':20*math.log10(max(quiet_peak,1e-15)),'new_voice_generated':False,'tts_api_calls':0,'music_added':False,'sfx_added':False,'ambience_added':False,'duration_seconds':plan['duration_seconds'],'frames':frames,'anchors':len(anchors),'source_v5_sha256':plan['video_sha256'],'source_v2_sha256':plan['audio_sha256'],'sha256':sha,'bytes':destination.stat().st_size,'full_decode':True,'visual_proof_count':len(diffs),'release_url':release['html_url'],'asset':asset};(P/'Hybrid_Delivery_Receipt_v06.json').write_text(json.dumps(receipt,indent=2));status={'status':'complete_verified'};print('Verified voice-only hybrid uploaded',sha,flush=True)
          except Exception as e:
           status={'status':'failed','type':type(e).__name__,'error':str(e)}
           if (R/'encode.log').exists():(P/'encode_error_tail.txt').write_text((R/'encode.log').read_text()[-3000:])
           raise
          finally:(P/'status.json').write_text(json.dumps(status,indent=2))
          PYWORK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-v06-proof-and-receipt
          path: /tmp/hybrid-v06/proof
          retention-days: 7
